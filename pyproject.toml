[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trmlu-audit"
version = "0.1.0"
description = "API-only cross-lingual contamination detection tooling for TR-MMLU (Turkish LLM evaluation)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oğuz Emre Cura", email = "oguzemrecura@gmail.com" }]
keywords = ["nlp", "llm", "turkish", "benchmark", "contamination", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.19",
    "openai>=1.30",
    "pandas>=2.2",
    "scipy>=1.11",
    "huggingface_hub>=0.23",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
trmlu-audit = "trmlu_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.deptry.per_rule_ignores]
# DEP001: repro/ scripts import sibling modules (src/trmlu_audit via sys.path,
# probe_m1.py next to them) - not distributions.
DEP001 = ["trmlu_audit", "probe_m1"]
# DEP002: kept on purpose - pyarrow pins the parquet engine for datasets IO;
# pytest/ruff are the dev extra (invoked by hand, not imported by the package).
DEP002 = ["pyarrow", "pytest", "ruff"]