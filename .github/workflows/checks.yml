name: checks

# First machine gate for this repo: dependency conformance (declared env vs
# imports, via deptry) + an import smoke. Before this gate, a clean `uv sync`
# did not install everything the repro/ scripts import (scipy, pandas,
# huggingface_hub were imported but undeclared - found by the W39 maintenance
# pass with deptry 0.25.1, the same defect class as the jepa torch incident).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Import smoke (package + previously-undeclared imports)
        run: uv run python -c "import trmlu_audit, trmlu_audit.cli, scipy, pandas, huggingface_hub"
      - name: Dependency conformance (deptry)
        run: uvx deptry==0.25.1 . --no-ansi
